[project]
name = "kludge"
description = "Makeshift helper nodes, mostly for Anima (2B / 2.9B): INT8 quantize on load, 2.9B LoRA remap, Spectrum, SPEED, block compile, guider model tracking, SnapRef."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Only what ComfyUI already ships (torch, safetensors, comfy_kitchen); nothing to install.
dependencies = []
classifiers = [
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/joykst96/comfyui-kludge"
Documentation = "https://github.com/joykst96/comfyui-kludge#readme"
"Bug Tracker" = "https://github.com/joykst96/comfyui-kludge/issues"

[tool.comfy]
PublisherId = "joykst96"
DisplayName = "kludge"
# Guider Track Model and SnapRef were only checked on 0.45.0 (the older nodes also on 0.43.0),
# and one failing import takes the whole pack down. See MAINTENANCE.md.
requires-comfyui = ">=0.45.0"
